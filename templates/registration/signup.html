{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<section class="cartao estreito">
    <h1>Criar conta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a href="{% url 'login' %}">Entrar</a>.</p>
</section>
{% endblock %}
