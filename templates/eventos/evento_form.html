{% extends "base.html" %}
{% block title %}{% if object %}Editar evento{% else %}Novo evento{% endif %}{% endblock %}
{% block content %}
<section class="cartao estreito">
    <h1>{% if object %}Editar {{ object.nome }}{% else %}Novo evento{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
        <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'eventos:meus_eventos' %}{% endif %}">Voltar</a>
    </form>
</section>
{% endblock %}
